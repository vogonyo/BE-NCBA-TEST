apiVersion: v1
kind: ConfigMap
metadata:
  name: rdas-config
  namespace: rdas
  labels:
    app: rdas
data:
  SPRING_APPLICATION_NAME: "rdas"
  SERVER_PORT: "8080"
  RDAS_SOAP_ENDPOINT: "http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso"
  RDAS_SOAP_CONNECT_TIMEOUT_MS: "5000"
  RDAS_SOAP_READ_TIMEOUT_MS: "30000"
  RDAS_CACHE_REFRESH_INTERVAL_MS: "3600000"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  LOGGING_LEVEL_COM_BACKEND_NCBA: "INFO"
